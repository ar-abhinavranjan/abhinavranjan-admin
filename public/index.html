<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>AR. Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23d4af37'%3EAR.%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

  <!-- ===== Sign-in screen ===== -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <div class="mark" aria-hidden="true">AR.</div>
      <h1 id="loginTitle">AR. Admin</h1>
      <p id="loginSub" class="muted">Private area. Sign in to view messages and appointments.</p>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="100">

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
        <button id="togglePw" class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <p id="capsHint" class="hint" hidden>Caps Lock is on</p>

      <p id="loginError" class="error" role="alert" hidden></p>
      <button id="loginBtn" class="btn primary wide" type="submit">Sign in</button>
      <p class="fine muted">Protected by server-side authentication. Sessions expire after 8 hours.</p>
    </form>
  </main>

  <!-- ===== App ===== -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="mark small" aria-hidden="true">AR.</span>
        <span class="brand-text">
          <strong id="brandName">AR. Admin</strong>
          <span id="brandSub" class="muted"></span>
        </span>
      </div>

      <nav class="tabs" aria-label="Sections">
        <button class="tab active" data-tab="overview" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          <span>Overview</span>
        </button>
        <button class="tab" data-tab="messages" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
          <span>Messages</span><b id="badgeMessages" class="badge" hidden>0</b>
        </button>
        <button class="tab" data-tab="appointments" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Appointments</span><b id="badgeAppointments" class="badge" hidden>0</b>
        </button>
      </nav>

      <div class="actions">
        <button id="refreshBtn" class="btn ghost small" type="button" title="Refresh">Refresh</button>
        <button id="logoutBtn" class="btn ghost small" type="button">Sign out</button>
      </div>
    </header>

    <section id="viewOverview" class="view"></section>

    <section id="viewList" class="view split" hidden>
      <div class="list-pane">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, email, phone, text" aria-label="Search">
          <select id="sort" aria-label="Sort"></select>
        </div>
        <div id="chips" class="chips"></div>
        <ul id="items" class="items"></ul>
        <p id="empty" class="muted center empty" hidden>Nothing here yet.</p>
      </div>
      <article id="detail" class="detail-pane">
        <button id="backBtn" class="btn ghost back" type="button">&larr; Back</button>
        <div id="detailBody"></div>
      </article>
    </section>

    <p id="lastSync" class="muted sync"></p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
